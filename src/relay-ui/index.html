<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Antigravity Remote Companion</title>
    <style>
      :root {
        --bg-primary: #090d16;
        --bg-surface: #111827;
        --bg-card: #1f2937;
        --border-color: #374151;
        --text-primary: #f9fafb;
        --text-secondary: #9ca3af;
        --accent-emerald: #10b981;
        --accent-amber: #f59e0b;
        --accent-rose: #ef4444;
        --accent-blue: #3b82f6;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        overflow-x: hidden;
      }
      header {
        padding: 12px 16px;
        background-color: var(--bg-surface);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 600;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .status-live {
        background-color: rgba(16, 185, 129, 0.15);
        color: var(--accent-emerald);
      }
      .status-live .status-dot {
        background-color: var(--accent-emerald);
      }
      .status-buffering {
        background-color: rgba(245, 158, 11, 0.15);
        color: var(--accent-amber);
      }
      .status-buffering .status-dot {
        background-color: var(--accent-amber);
        animation: pulse 1.5s infinite;
      }
      .status-disconnected {
        background-color: rgba(239, 68, 68, 0.15);
        color: var(--accent-rose);
      }
      .status-disconnected .status-dot {
        background-color: var(--accent-rose);
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .card {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 14px;
      }
      .card-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .stream-message {
        margin-bottom: 8px;
        font-size: 14px;
        line-height: 1.5;
      }
      .action-card {
        border-left: 4px solid var(--accent-amber);
        margin-top: 8px;
      }
      .action-buttons {
        display: flex;
        gap: 10px;
        margin-top: 12px;
      }
      .btn {
        min-height: 48px;
        min-width: 48px;
        padding: 10px 16px;
        border-radius: 6px;
        border: none;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 1;
        transition: background-color 0.15s;
      }
      .btn-approve {
        background-color: var(--accent-emerald);
        color: #ffffff;
      }
      .btn-reject {
        background-color: var(--accent-rose);
        color: #ffffff;
      }
      .btn-secondary {
        background-color: var(--bg-card);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
      }
      footer {
        background-color: var(--bg-surface);
        border-top: 1px solid var(--border-color);
        padding: 12px 16px;
        position: sticky;
        bottom: 0;
      }
      .input-row {
        display: flex;
        gap: 8px;
      }
      .input-field {
        flex: 1;
        min-height: 48px;
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 10px 12px;
        color: var(--text-primary);
        font-size: 14px;
        outline: none;
      }
      .input-field:focus {
        border-color: var(--accent-blue);
      }
      .btn-send {
        min-height: 48px;
        min-width: 64px;
        background-color: var(--accent-blue);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1 style="font-size: 16px; font-weight: 700">Antigravity Remote</h1>
        <p
          id="accountLabel"
          style="font-size: 11px; color: var(--text-secondary)"
        >
          Connecting...
        </p>
      </div>
      <div id="statusBadge" class="status-badge status-connecting">
        <span class="status-dot"></span>
        <span id="statusText">Connecting</span>
      </div>
    </header>

    <main id="conversationStream">
      <div class="card">
        <div class="card-title">Activity Stream</div>
        <p class="stream-message" style="color: var(--text-secondary)">
          Ready. Connected to local relay bridge.
        </p>
      </div>
    </main>

    <footer>
      <div class="input-row">
        <input
          type="text"
          id="promptInput"
          class="input-field"
          placeholder="Type instruction or prompt..."
        />
        <button id="sendBtn" class="btn btn-send">Send</button>
      </div>
    </footer>

    <script>
      (function () {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get("token") || urlParams.get("pair") || "";
        const statusBadge = document.getElementById("statusBadge");
        const statusText = document.getElementById("statusText");
        const stream = document.getElementById("conversationStream");
        const promptInput = document.getElementById("promptInput");
        const sendBtn = document.getElementById("sendBtn");

        function updateStatus(state, text) {
          statusBadge.className = "status-badge status-" + state;
          statusText.textContent = text;
        }

        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl =
          protocol +
          "//" +
          window.location.host +
          "/ws?token=" +
          encodeURIComponent(token);
        let socket = null;

        function connect() {
          updateStatus("buffering", "Connecting...");
          socket = new WebSocket(wsUrl);

          socket.onopen = function () {
            updateStatus("live", "Live");
          };

          socket.onmessage = function (event) {
            try {
              const data = JSON.parse(event.data);
              if (data.type === "BUFFERING_ALERT") {
                updateStatus("buffering", "Buffering (swapping accounts...)");
              } else if (data.type === "SWAP_RESUMED") {
                updateStatus("live", "Live");
              } else if (data.type === "ACTION_PROPOSAL") {
                renderActionProposal(data.payload);
              } else if (data.type === "AGENT_OUTPUT") {
                renderMessage(
                  "Assistant",
                  data.payload.text || JSON.stringify(data.payload),
                );
              }
            } catch (e) {
              // Suppress parse error
            }
          };

          socket.onclose = function () {
            updateStatus("disconnected", "Disconnected");
          };

          socket.onerror = function () {
            updateStatus("disconnected", "Error");
          };
        }

        function renderMessage(sender, text) {
          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML =
            '<div class="card-title">' +
            sender +
            '</div><p class="stream-message">' +
            text +
            "</p>";
          stream.appendChild(div);
          stream.scrollTop = stream.scrollHeight;
        }

        function renderActionProposal(payload) {
          const div = document.createElement("div");
          div.className = "card action-card";
          div.innerHTML =
            '<div class="card-title">Action Authorization Required</div>' +
            '<p class="stream-message"><code>' +
            (payload.command || "Execute action") +
            "</code></p>" +
            '<div class="action-buttons">' +
            '<button class="btn btn-approve">Approve</button>' +
            '<button class="btn btn-reject">Reject</button>' +
            "</div>";

          div
            .querySelector(".btn-approve")
            .addEventListener("click", function () {
              send({
                type: "APPROVE_ACTION",
                payload: { actionId: payload.id },
              });
              div.remove();
            });
          div
            .querySelector(".btn-reject")
            .addEventListener("click", function () {
              send({
                type: "REJECT_ACTION",
                payload: { actionId: payload.id },
              });
              div.remove();
            });
          stream.appendChild(div);
          stream.scrollTop = stream.scrollHeight;
        }

        function send(cmd) {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify(cmd));
          }
        }

        sendBtn.addEventListener("click", function () {
          const val = promptInput.value.trim();
          if (val) {
            renderMessage("You", val);
            send({ type: "PROMPT", payload: { text: val } });
            promptInput.value = "";
          }
        });

        if (token) {
          connect();
        } else {
          updateStatus("disconnected", "Missing Token");
        }
      })();
    </script>
  </body>
</html>
